<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name = "viewport" content="width = device-width , initial-scale = 1.0" >
        <title>To do list</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    </head>
<body>
    <div class="theme-container">
    <button id="theme-btn">
        🌙 Dark
    </button>
</div>
    <h1  class="title"><i class="fa-solid fa-clipboard"></i> TO DO LIST</h1>
    <p class="subtitle">
  Organize your tasks and get things done
</p>


<div class="to-do-list">
    <div class="input-container">
    <input id="task-input" type="text" placeholder="What do you want to do?">
    <button id="add-task-btn">Add Task+</button>
    </div>
<nav class="filter-nav">
    <button id="All" type="button" class="filter-btn">All</button>
    <button id="Active" class="filter-btn">Active</button>
    <button id="Completed" class="filter-btn">Completed</button>
</nav>
<ul id="task-list">

</ul>
</div>
<div id="controls">
    <div class="status">
    <p>
    <i class="fa-solid fa-list-check"></i>
    Tasks:
    <span id="task-count">0</span>
    </p>
    <p>
    <i class="fa-solid fa-check"></i>
    Completed:
    <span id="completed-count">0</span>
    </p>
    </div>
    <button type="button" id="delete-complete-btn"><i class="fa-solid fa-trash"></i>Clear Completed</button>
</div>
<script src="script.js"></script>
</body>
</html>
