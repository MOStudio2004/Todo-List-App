<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name = "viewport" content="width = device-width , initial-scale = 1.0" >
        <title>To do list</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link type="image/png" sizes="16x16" rel="icon" href="icons8-todo-list-64.png">
    </head>
<body>
    <div class="theme-container">
    <button id="theme-btn">
        🌙 Dark
    </button>
</div>
    <h1  class="title"><i class="fa-solid fa-clipboard"></i> TO DO LIST</h1>
    <p class="subtitle">
  Organize your tasks and get things done
</p>


<div class="to-do-list">
    <div class="input-container">
    <input id="task-input" type="text" placeholder="What do you want to do?">
    <button id="add-task-btn">Add Task+</button>
    </div>
<nav class="filter-nav">
    <button id="All" type="button" class="filter-btn">All</button>
    <button id="Active" class="filter-btn">Active</button>
    <button id="Completed" class="filter-btn">Completed</button>
</nav>
<ul id="task-list">
<div id="controls">
    <div class="status">
    <p>
    <i class="fa-solid fa-list-check"></i>
    Tasks:
    <span id="task-count">0</span>
    </p>
    <p>
    <i class="fa-solid fa-check"></i>
    Completed:
    <span id="completed-count">0</span>
    </p>
    </div>
    <button type="button" id="delete-complete-btn"><i class="fa-solid fa-trash"></i>Clear Completed</button>
</div>
</ul>
</div>
<div id="notes-screen"  class="hidden">
    <button id="add-note-btn"><i class="fa-solid fa-plus"></i></button>
        <div id="notes-container">
    
    </div>
</div>

<div id="note-editor" class="hidden">

    <div class="toolbar">
        <button id="bold-btn">
            <i class="fa-solid fa-bold"></i>
        </button>
        <button id="italic-btn">
            <i class="fa-solid fa-italic"></i>
        </button>
        <button id="underline-btn">
            <i class="fa-solid fa-underline"></i>
        </button>
        <input type="color" id="color-input">
            

    </div>

    <div
        id="editor"
        contenteditable="true"
        spellcheck="true">
    </div>

    <button id="save-btn">
        <i class="fa-solid fa-check"></i>
    </button>

</div>

    <header>
        <nav class="nav-links-container">
            <button id="list-btn"  class="links"><i class="fa-solid fa-list"></i> To Do List</button>
            <button id="notes-btn" class="links"><i class="fa-solid fa-pencil"></i> My Notes</button>
        </nav>
    </header>
<script src="script.js"></script>
</body>
</html>
